<title>Родословная Князевых</title>
<style>

html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0b1220;color:#e5e7eb}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{height:64px;background:#172033;border-bottom:1px solid #334155;display:flex;align-items:center;gap:8px;padding:8px 12px;position:relative;z-index:100}
.logo{font-weight:800;font-size:18px;white-space:nowrap;margin-right:6px}

.search{width:210px;background:#0f172a;color:#fff;border:1px solid #475569;border-radius:9px;padding:8px 10px;outline:0}
.stats{margin-left:auto;color:#94a3b8;font-size:12px;white-space:nowrap}
.workspace{position:relative;height:calc(100% - 64px);overflow:hidden}
#treeArea{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at center,rgba(59,130,246,.08),transparent 42%),#0b1220}

#world{position:absolute;left:0;top:0;width:9000px;height:6000px;transform-origin:0 0}
#connections{position:absolute;left:0;top:0;width:9000px;height:6000px;overflow:visible;pointer-events:none}
.connection{fill:none;stroke:#64748b;stroke-width:4;pointer-events:none}
.connection.spouse{stroke:#f59e0b;stroke-width:5}
.connection.selected{stroke:#60a5fa;stroke-width:7}
.connection-hit{fill:none;stroke:transparent;stroke-width:24;pointer-events:stroke;cursor:pointer}
.line-handle{fill:#60a5fa;stroke:#fff;stroke-width:3;cursor:grab;pointer-events:auto}
#peopleLayer{position:absolute;left:0;top:0;width:9000px;height:6000px}
.person{position:absolute;width:210px;min-height:126px;background:#1e293b;border:2px solid #475569;border-radius:15px;box-shadow:0 12px 28px rgba(0,0,0,.32);overflow:hidden;cursor:grab;user-select:none;touch-action:none;transition:box-shadow .1s,border-color .1s}
.person:hover{border-color:#64748b}
.person.dragging{cursor:grabbing;border-color:#60a5fa;box-shadow:0 18px 40px rgba(0,0,0,.5);transition:none;z-index:1000}
.person.highlight{border-color:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.18),0 18px 40px rgba(0,0,0,.45)}
.person.male{border-color:#3b82f6}.person.female{border-color:#ec4899}
.card-top{display:flex;gap:10px;padding:10px}
.avatar{width:58px;height:58px;flex:0 0 58px;border-radius:12px;overflow:hidden;background:#334155;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:23px;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{min-width:0}.name{font-size:14px;font-weight:800;line-height:1.25;overflow-wrap:anywhere;color:#f8fafc}
.date{font-size:11px;color:#94a3b8;margin-top:5px}.place{font-size:10px;color:#64748b;margin-top:2px}
.card-bottom{border-top:1px solid rgba(148,163,184,.15);padding:7px 10px;color:#94a3b8;font-size:10px}
.panel{position:absolute;right:12px;top:12px;width:330px;max-height:calc(100% - 24px);overflow:auto;background:rgba(15,23,42,.97);border:1px solid #334155;border-radius:15px;box-shadow:0 20px 50px rgba(0,0,0,.45);z-index:200;display:none}
.panel.open{display:block}.panel-head{position:sticky;top:0;background:#172033;border-bottom:1px solid #334155;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.close{width:30px;height:30px;border-radius:8px;border:1px solid #475569;background:#243044;color:#fff}.panel-body{padding:15px}
.field{margin-bottom:11px}.field label{display:block;color:#94a3b8;font-size:12px;margin-bottom:5px}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:1px solid #475569;background:#243044;color:#fff;padding:8px 10px;border-radius:8px}.actions .primary{background:#2563eb;border-color:#3b82f6}.actions .danger{background:#7f1d1d;border-color:#991b1b}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:none;align-items:center;justify-content:center}.modal-bg.open{display:flex}
.modal{width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:#172033;border:1px solid #475569;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.55)}

.help{position:absolute;left:12px;bottom:12px;z-index:150;background:rgba(15,23,42,.9);border:1px solid #334155;border-radius:9px;padding:8px 11px;color:#94a3b8;font-size:11px;pointer-events:none}
@media(max-width:900px){.topbar{height:auto;min-height:64px;flex-wrap:wrap}.stats{margin-left:0}.search{width:160px}.panel{width:calc(100% - 24px)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">🌳 Родословная Князевых</div>
  <button class="primary" onclick="openPersonEditor()">＋ Человек</button>
  <button onclick="startConnectMode()">🔗 Связь</button>
  <button onclick="centerTree()">⌂ Центр</button>
  <button onclick="restoreFullTree()">↻ Полная</button>
  <button onclick="exportData()">↓ Экспорт</button>
  <button onclick="document.getElementById('importFile').click()">↑ Импорт</button>
  <button onclick="resetPositions()">↺ Позиции</button>
  <input id="search" class="search" placeholder="Поиск человека…">
  <div id="stats" class="stats"></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(event)">
</header>

<main class="workspace">
  <div id="treeArea">
    <div id="world">
      <svg id="connections" viewBox="0 0 9000 6000"></svg>
      <div id="peopleLayer"></div>
    </div>
  </div>

  <aside id="panel" class="panel">
    <div class="panel-head"><strong id="panelTitle"></strong><button class="close" onclick="closePanel()">×</button></div>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <div class="help">ЛКМ по карточке — перетащить · колесо — масштаб · пустое место — двигать всю схему</div>
</main>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <div class="modal-head"><strong id="modalTitle">Человек</strong><button class="close" onclick="closeModal()">×</button></div>
    <form id="personForm">
      <div class="modal-body">
        <input id="editId" type="hidden">
        <div class="row">
          <div class="field"><label>Имя</label><input id="firstName" required></div>
          <div class="field"><label>Фамилия</label><input id="lastName"></div>
        </div>
        <div class="row">
          <div class="field"><label>Дата рождения</label><input id="birthDate"></div>
          <div class="field"><label>Место рождения</label><input id="birthPlace"></div>
        </div>
        <div class="row">
          <div class="field"><label>Пол</label><select id="gender"><option value="male">Мужчина</option><option value="female">Женщина</option><option value="unknown">Не указан</option></select></div>
          <div class="field"><label>Фотография</label><input id="photo" type="file" accept="image/*"></div>
        </div>
        <div class="field"><label>Родители</label><select id="parents" multiple size="6"></select></div>
        <div class="field"><label>Заметки</label><textarea id="notes"></textarea></div>
      </div>
      <div class="modal-foot"><button type="button" onclick="closeModal()">Отмена</button><button class="primary" type="submit">Сохранить</button></div>
    </form>
  </div>
</div>

  let x={};
  try{x=JSON.parse(localStorage.getItem(POSITIONS_KEY)||"{}")||{}}catch(e){}
  people.forEach(p=>{if(!x[p.id])x[p.id]=POS[p.id]?{x:POS[p.id][0],y:POS[p.id][1]}:{x:4000,y:3000}});
  return x;
}
function savePositions(){localStorage.setItem(POSITIONS_KEY,JSON.stringify(positions))}
function buildConnections(){
  const a=[],seen=new Set();
  people.forEach(ch=>(ch.parents||[]).forEach(pa=>{
    if(!getPerson(pa))return;
    const k=pa+">"+ch.id;if(seen.has(k))return;seen.add(k);
    a.push({id:uid(),type:"parent",from:pa,to:ch.id,bendX:0,bendY:0});
  }));
  const s=new Set();
  people.forEach(p=>(p.spouses||[]).forEach(q=>{
    if(!getPerson(q))return;const ids=[p.id,q].sort(),k=ids[0]+"::"+ids[1];
    if(s.has(k))return;s.add(k);a.push({id:uid(),type:"spouse",from:p.id,to:q,bendX:0,bendY:0});
  }));
  return a;
}
function loadConnections(){
  try{const x=JSON.parse(localStorage.getItem(CONNECTIONS_KEY)||"null");if(Array.isArray(x)&&x.length)return x}catch(e){}
  return buildConnections();
}
function saveConnections(){localStorage.setItem(CONNECTIONS_KEY,JSON.stringify(connections))}
function syncRelations(){
  people.forEach(p=>{p.parents=[];p.spouses=[]});
  connections.forEach(c=>{
    const a=getPerson(c.from),b=getPerson(c.to);if(!a||!b)return;
    if(c.type==="parent")a&&b.parents.push(c.from);
    else{a.spouses.push(b.id);b.spouses.push(a.id)}
  });
  people.forEach(p=>{p.parents=[...new Set(p.parents)];p.spouses=[...new Set(p.spouses)]});
  savePeople();
}
function setTransform(){world.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`}
function worldPoint(cx,cy){const r=area.getBoundingClientRect();return{x:(cx-r.left-ox)/scale,y:(cy-r.top-oy)/scale}}

function cardHTML(p){
  const letter=(p.firstName||p.lastName||"?").trim()[0]?.toUpperCase()||"?";
  return `<div class="card-top"><div class="avatar">${p.photo?`<img src="${esc(p.photo)}">`:esc(letter)}</div><div class="info"><div class="name">${esc(nameOf(p))}</div><div class="date">${esc(p.birthDate||"Дата неизвестна")}</div>${p.birthPlace?`<div class="place">${esc(p.birthPlace)}</div>`:""}</div></div><div class="card-bottom">${p.parents?.length?`Родителей: ${p.parents.length}`:"Родители неизвестны"}</div>`;
}

function renderPeople(){
  peopleLayer.innerHTML="";
  people.forEach(p=>{
    const pos=positions[p.id]||{x:4000,y:3000};
    const el=document.createElement("div");
    el.className=`person ${p.gender||"unknown"}`;
    if(selectedPerson===p.id)el.classList.add("highlight");
    el.dataset.id=p.id;
    el.style.left=pos.x+"px";el.style.top=pos.y+"px";
    el.innerHTML=cardHTML(p);
    el.addEventListener("pointerdown",startPersonDrag);
    el.addEventListener("click",e=>{
      e.stopPropagation();
      if(el.dataset.dragged==="1"){delete el.dataset.dragged;return}
      if(connectMode){connectPerson(p.id);return}
      selectedPerson=p.id;selectedConnection=null;openPersonPanel(p);renderPeople();renderConnections();
    });
    el.addEventListener("dblclick",e=>{e.stopPropagation();openPersonEditor(p.id)});
    peopleLayer.appendChild(el);
  });
}

function pathFor(c){
  const a=positions[c.from],b=positions[c.to];if(!a||!b)return "";
  const ax=a.x+105,ay=a.y+63,bx=b.x+105,by=b.y+63;
  const mx=(ax+bx)/2+(c.bendX||0),my=(ay+by)/2+(c.bendY||0);
  return c.type==="spouse"?`M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}`:`M ${ax} ${ay} L ${ax} ${my} L ${mx} ${my} L ${bx} ${my} L ${bx} ${by}`;
}
function renderConnections(){
  svg.innerHTML="";
  connections.forEach(c=>{
    const d=pathFor(c);if(!d)return;
    const hit=document.createElementNS("http://www.w3.org/2000/svg","path");
    hit.setAttribute("d",d);hit.classList.add("connection-hit");hit.dataset.id=c.id;
    hit.addEventListener("click",e=>{e.stopPropagation();selectedConnection=c.id;selectedPerson=null;openConnectionPanel(c);renderPeople();renderConnections()});
    svg.appendChild(hit);
    const line=document.createElementNS("http://www.w3.org/2000/svg","path");
    line.setAttribute("d",d);line.classList.add("connection",c.type);if(selectedConnection===c.id)line.classList.add("selected");
    svg.appendChild(line);
    if(selectedConnection===c.id){
      const a=positions[c.from],b=positions[c.to];
      if(a&&b){
        const cx=(a.x+105+b.x+105)/2+(c.bendX||0),cy=(a.y+63+b.y+63)/2+(c.bendY||0);
        const h=document.createElementNS("http://www.w3.org/2000/svg","circle");
        h.setAttribute("cx",cx);h.setAttribute("cy",cy);h.setAttribute("r",9);h.classList.add("line-handle");
        h.addEventListener("pointerdown",e=>{e.stopPropagation();e.preventDefault();handleDrag={id:c.id,pointerId:e.pointerId}});
        svg.appendChild(h);
      }
    }
  });
}
function render(){renderConnections();renderPeople();document.getElementById("stats").textContent=`Людей: ${people.length} · Связей: ${connections.length}`}

function startPersonDrag(e){
  if(connectMode)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  const el=e.currentTarget,p=getPerson(el.dataset.id),pos=positions[p.id];
  const pt=worldPoint(e.clientX,e.clientY);
  drag={id:p.id,el,pointerId:e.pointerId,sx:pt.x,sy:pt.y,px:pos.x,py:pos.y,moved:false};
  el.setPointerCapture?.(e.pointerId);el.classList.add("dragging");
  e.stopPropagation();e.preventDefault();
}
document.addEventListener("pointermove",e=>{
  if(drag&&e.pointerId===drag.pointerId){
    const pt=worldPoint(e.clientX,e.clientY),dx=pt.x-drag.sx,dy=pt.y-drag.sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3)drag.moved=true;
    if(drag.moved){
      positions[drag.id]={x:drag.px+dx,y:drag.py+dy};
      drag.el.style.left=positions[drag.id].x+"px";drag.el.style.top=positions[drag.id].y+"px";
      renderConnections();savePositions();drag.el.dataset.dragged="1";
    }
    e.preventDefault();
  }
  if(handleDrag&&e.pointerId===handleDrag.pointerId){
    const c=connections.find(x=>x.id===handleDrag.id);if(!c)return;
    const a=positions[c.from],b=positions[c.to],pt=worldPoint(e.clientX,e.clientY);
    c.bendX=pt.x-(a.x+105+b.x+105)/2;c.bendY=pt.y-(a.y+63+b.y+63)/2;
    renderConnections();saveConnections();e.preventDefault();
  }
},{passive:false,capture:true});
document.addEventListener("pointerup",e=>{
  if(drag&&e.pointerId===drag.pointerId){drag.el.classList.remove("dragging");savePositions();drag=null}
  if(handleDrag&&e.pointerId===handleDrag.pointerId){saveConnections();handleDrag=null}
},{capture:true});

area.addEventListener("wheel",e=>{
  e.preventDefault();const before=worldPoint(e.clientX,e.clientY),factor=e.deltaY<0?1.12:.89;
  scale=Math.max(.25,Math.min(2.5,scale*factor));const r=area.getBoundingClientRect();
  ox=e.clientX-r.left-before.x*scale;oy=e.clientY-r.top-before.y*scale;setTransform();
},{passive:false});

area.addEventListener("pointerdown",e=>{
  if(e.target.closest(".person"))return;
  if(e.target.closest(".connection-hit,.line-handle"))return;
  if(e.button!==0&&e.button!==1)return;
  const pt={x:e.clientX,y:e.clientY};pan={sx:pt.x,sy:pt.y,ox,oy};area.setPointerCapture?.(e.pointerId);
});
area.addEventListener("pointermove",e=>{if(!pan)return;ox=pan.ox+e.clientX-pan.sx;oy=pan.oy+e.clientY-pan.sy;setTransform()});
area.addEventListener("pointerup",()=>pan=null);
area.addEventListener("pointercancel",()=>pan=null);

function centerOn(id){
  const p=positions[id];if(!p)return;
  const r=area.getBoundingClientRect();ox=r.width/2-(p.x+105)*scale;oy=r.height/2-(p.y+63)*scale;setTransform();
}
function centerTree(){scale=.65;centerOn("denis")}
function closePanel(){document.getElementById("panel").classList.remove("open")}
function openPersonPanel(p){
  const body=document.getElementById("panelBody");
  const parents=(p.parents||[]).map(getPerson).filter(Boolean).map(x=>`<div class="value">${esc(nameOf(x))}</div>`).join("")||'<div class="value">не указаны</div>';
  const spouses=(p.spouses||[]).map(getPerson).filter(Boolean).map(x=>`<div class="value">${esc(nameOf(x))}</div>`).join("")||'<div class="value">не указаны</div>';
  document.getElementById("panelTitle").textContent=nameOf(p);
  body.innerHTML=`<div class="detail-name">${esc(nameOf(p))}</div>
  <div class="detail-row"><div class="label">Дата рождения</div><div class="value">${esc(p.birthDate||"не указана")}</div></div>
  <div class="detail-row"><div class="label">Место рождения</div><div class="value">${esc(p.birthPlace||"не указано")}</div></div>
  <div class="detail-row"><div class="label">Родители</div>${parents}</div>
  <div class="detail-row"><div class="label">Супруг(и)</div>${spouses}</div>
  ${p.notes?`<div class="detail-row"><div class="label">Заметки</div><div class="value">${esc(p.notes)}</div></div>`:""}
  <div class="actions" style="margin-top:14px"><button class="primary" onclick="openPersonEditor('${p.id}')">✎ Изменить</button><button onclick="centerOn('${p.id}')">⌖ Центр</button><button class="danger" onclick="deletePerson('${p.id}')">🗑 Удалить</button></div>`;
  document.getElementById("panel").classList.add("open");
}
function openConnectionPanel(c){
  const a=getPerson(c.from),b=getPerson(c.to);
  document.getElementById("panelTitle").textContent="Редактирование связи";
  document.getElementById("panelBody").innerHTML=`<div class="detail-row"><div class="label">Тип</div><div class="value">${c.type==="spouse"?"Супруги / пара":"Родитель → ребёнок"}</div></div>
  <div class="detail-row"><div class="label">Люди</div><div class="value">${esc(nameOf(a))} → ${esc(nameOf(b))}</div></div>
  <div class="actions"><button onclick="changeConnectionType('${c.id}')">Сменить тип</button><button onclick="resetBend('${c.id}')">Сбросить изгиб</button><button class="danger" onclick="deleteConnection('${c.id}')">🗑 Удалить</button></div>
  <p style="color:#94a3b8;font-size:12px;line-height:1.5">Синяя точка на линии позволяет вручную изменить её изгиб.</p>`;
  document.getElementById("panel").classList.add("open");
}
function changeConnectionType(id){const c=connections.find(x=>x.id===id);if(!c)return;c.type=c.type==="parent"?"spouse":"parent";syncPeople();saveConnections();render();openConnectionPanel(c)}
function resetBend(id){const c=connections.find(x=>x.id===id);if(!c)return;c.bendX=0;c.bendY=0;saveConnections();renderConnections()}
function deleteConnection(id){if(!confirm("Удалить эту связь?"))return;connections=connections.filter(c=>c.id!==id);syncPeople();saveConnections();selectedConnection=null;closePanel();render()}
function syncPeople(){people.forEach(p=>{p.parents=[];p.spouses=[]});connections.forEach(c=>{const a=getPerson(c.from),b=getPerson(c.to);if(!a||!b)return;if(c.type==="parent")b.parents.push(a.id);else{a.spouses.push(b.id);b.spouses.push(a.id)}});people.forEach(p=>{p.parents=[...new Set(p.parents)];p.spouses=[...new Set(p.spouses)]});savePeople()}

function startConnectMode(){connectMode=true;connectFirst=null;alert("Нажмите первого человека, затем второго. После этого выберите тип связи.")}
function connectPerson(id){
  if(!connectFirst){connectFirst=id;selectedPerson=id;renderPeople();return}
  if(connectFirst===id){connectMode=false;connectFirst=null;return}
  const a=getPerson(connectFirst),b=getPerson(id);
  const t=prompt(`Связь между:\n${nameOf(a)}\nи\n${nameOf(b)}\n\n1 — родитель → ребёнок\n2 — супруги`,`1`);
  if(t!=="1"&&t!=="2"){connectMode=false;connectFirst=null;return}
  let from=connectFirst,to=id;
  if(t==="1"&&!confirm(`Родитель — ${nameOf(a)}?\n\nOK — да\nОтмена — ${nameOf(b)} является родителем`)){from=id;to=connectFirst}
  connections.push({id:uid(),type:t==="1"?"parent":"spouse",from,to,bendX:0,bendY:0});
  syncPeople();saveConnections();connectMode=false;connectFirst=null;render();
}

function openPersonEditor(id=null){
  document.getElementById("personForm").reset();document.getElementById("editId").value=id||"";
  const p=id?getPerson(id):null;
  document.getElementById("modalTitle").textContent=id?"Редактирование человека":"Новый человек";
  if(p){
    firstName.value=p.firstName||"";lastName.value=p.lastName||"";birthDate.value=p.birthDate||"";birthPlace.value=p.birthPlace||"";gender.value=p.gender||"unknown";notes.value=p.notes||"";
  }
  fillParents(id);document.getElementById("modalBg").classList.add("open");
}
function fillParents(id){
  parents.innerHTML="";
  people.filter(p=>p.id!==id).sort((a,b)=>nameOf(a).localeCompare(nameOf(b),"ru")).forEach(p=>{
    const o=document.createElement("option");o.value=p.id;o.textContent=nameOf(p);if(id&&getPerson(id).parents.includes(p.id))o.selected=true;parents.appendChild(o);
  });
}
function closeModal(){document.getElementById("modalBg").classList.remove("open")}
async function toDataUrl(file){return new Promise((res,rej)=>{if(!file)return res("");const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
document.getElementById("personForm").addEventListener("submit",async e=>{
  e.preventDefault();const id=editId.value.trim(), selected=[...parents.selectedOptions].map(o=>o.value);let photo=id?(getPerson(id)?.photo||""):"";if(photo.files)photo="";
  const file=document.getElementById("photo").files[0];if(file)photo=await toDataUrl(file);
  if(id){
    const p=getPerson(id);p.firstName=firstName.value.trim();p.lastName=lastName.value.trim();p.birthDate=birthDate.value.trim();p.birthPlace=birthPlace.value.trim();p.gender=gender.value;p.notes=notes.value.trim();p.photo=photo;
    connections=connections.filter(c=>!(c.type==="parent"&&c.to===id));selected.forEach(pa=>connections.push({id:uid(),type:"parent",from:pa,to:id,bendX:0,bendY:0}));
  }else{
    const nid=uid();people.push({id:nid,firstName:firstName.value.trim(),lastName:lastName.value.trim(),birthDate:birthDate.value.trim(),birthPlace:birthPlace.value.trim(),gender:gender.value,photo,notes:notes.value.trim(),parents:selected,spouses:[]});
    positions[nid]={x:4000+Math.random()*500,y:3000+Math.random()*400};selected.forEach(pa=>connections.push({id:uid(),type:"parent",from:pa,to:nid,bendX:0,bendY:0}));
  }
  syncPeople();saveConnections();savePositions();closeModal();render();
});
function deletePerson(id){const p=getPerson(id);if(!p||!confirm(`Удалить ${nameOf(p)} и все его связи?`))return;people=people.filter(x=>x.id!==id);connections=connections.filter(c=>c.from!==id&&c.to!==id);delete positions[id];syncPeople();saveConnections();savePositions();selectedPerson=null;closePanel();render()}

document.getElementById("search").addEventListener("input",function(){
  const q=this.value.trim().toLowerCase();document.querySelectorAll(".person").forEach(el=>el.classList.toggle("highlight",!!q&&(nameOf(getPerson(el.dataset.id))+" "+getPerson(el.dataset.id).birthPlace).toLowerCase().includes(q)));
});
document.getElementById("search").addEventListener("keydown",function(e){if(e.key!=="Enter")return;const q=this.value.trim().toLowerCase();const p=people.find(x=>(nameOf(x)+" "+x.birthPlace+" "+x.birthDate).toLowerCase().includes(q));if(p){selectedPerson=p.id;openPersonPanel(p);centerOn(p.id);renderPeople()}});

function exportData(){
  const blob=new Blob([JSON.stringify({version:"3.4",people,connections,positions},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rodoslovnaya-knyazevy.json";a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
    try{
      const d=JSON.parse(r.result);people=Array.isArray(d)?d:d.people;connections=Array.isArray(d.connections)?d.connections:buildConnections();positions=d.positions||{};
      people=people.map(p=>({...p,parents:p.parents||[],spouses:p.spouses||[]}));people.forEach(p=>{if(!positions[p.id])positions[p.id]=POS[p.id]?{x:POS[p.id][0],y:POS[p.id][1]}:{x:4000,y:3000}});
      syncPeople();saveConnections();savePositions();render();centerTree();alert(`Импортировано людей: ${people.length}`);
    }catch(err){alert("Ошибка импорта: "+err.message)}
    e.target.value="";
  };r.readAsText(f,"utf-8");
}
function resetPositions(){if(!confirm("Вернуть исходное расположение всех карточек?"))return;positions={};people.forEach(p=>positions[p.id]=POS[p.id]?{x:POS[p.id][0],y:POS[p.id][1]}:{x:4000,y:3000});savePositions();render();centerTree()}
function restoreFullTree(){if(!confirm("Восстановить полный исходный набор родственников? Текущие изменения людей и связей будут заменены."))return;people=clone(FULL);connections=buildConnections();positions={};people.forEach(p=>positions[p.id]=POS[p.id]?{x:POS[p.id][0],y:POS[p.id][1]}:{x:4000,y:3000});savePeople();saveConnections();savePositions();selectedPerson=null;selectedConnection=null;closePanel();render();centerTree()}
function closeAllOnEmpty(e){if(e.target===area){selectedPerson=null;selectedConnection=null;closePanel();renderPeople();renderConnections()}}
area.addEventListener("click",closeAllOnEmpty);

savePeople();saveConnections();savePositions();render();centerTree();
</script>
</body>
</html>
